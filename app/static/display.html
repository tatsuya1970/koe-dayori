<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声だより</title>
<style>
  :root {
    --bg: #fbf7ef;
    --ink: #1f1b16;
    --sub: #6b6257;
    --accent: #b5452b;
    --card: #ffffff;
    --line: #e4dccd;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    overflow: hidden;
    transition: background 1s, color 1s;
  }
  .screen { display: none; height: 100vh; padding: 4vh 5vw; flex-direction: column; }
  .screen.on { display: flex; }

  /* ふだん：LINE のトークのような画面（11/8） */
  #idle { padding: 0; }
  #idle .bar {
    display: flex; align-items: baseline; justify-content: space-between;
    background: #2f3e57; color: #fff; padding: 1.6vh 4vw;
  }
  #idle .bar .room { font-size: 4.2vh; font-weight: bold; }
  #idle .bar .date { font-size: 3.6vh; opacity: 0.85; margin-left: auto; margin-right: 2vw; }
  #idle .bar .time { font-size: 6vh; font-weight: bold; letter-spacing: 0.04em; }
  #idle .chat {
    flex: 1; min-height: 0; overflow: hidden; background: #8cabd8;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 2.2vh; padding: 2.5vh 3vw;
  }
  #idle .msg { display: flex; align-items: flex-end; gap: 1.2vw; max-width: 100%; }
  #idle .msg.parent { flex-direction: row-reverse; }
  #idle .avatar {
    flex: none; width: 8vh; height: 8vh; border-radius: 50%; background: #fff; color: #2f3e57;
    display: flex; align-items: center; justify-content: center; font-size: 4vh; font-weight: bold;
    align-self: flex-start;
  }
  #idle .col { display: flex; flex-direction: column; gap: 0.6vh; max-width: 70%; }
  #idle .msg.parent .col { align-items: flex-end; }
  #idle .name { font-size: 2.8vh; color: #1f2a3d; }
  #idle .bubble {
    font-size: 4.4vh; line-height: 1.45; padding: 1.6vh 2.2vw; border-radius: 3vh;
    background: #fff; color: #111; white-space: pre-wrap; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  }
  #idle .msg.parent .bubble { background: #8de055; }
  #idle .bubble.urgent { box-shadow: 0 0 0 0.6vh #d93025; }
  /* 写真は切り取らない（11/8）。列の幅に引き伸ばされて cover で端が切れていたので、元の縦横比のまま収める */
  #idle .photo { align-self: flex-start; width: auto; height: auto; max-height: 24vh; max-width: 100%; border-radius: 2vh; object-fit: contain; }
  #idle .meta { flex: none; font-size: 2.4vh; color: #1f2a3d; text-align: right; line-height: 1.3; }
  #idle .msg.family .meta { text-align: left; }
  #idle .meta .tag { display: block; font-weight: bold; }
  #idle .meta .tag.red { color: #b3121f; }
  #idle .empty { font-size: 4vh; color: #fff; text-align: center; margin: auto; }

  /* 新着 */
  #new { justify-content: center; align-items: center; text-align: center; background: #fff3d6; }
  #new .count { font-size: 11vh; font-weight: bold; color: var(--accent); animation: glow 3s ease-in-out infinite; }
  #new .from { font-size: 7vh; margin-top: 3vh; }
  #new .ask { font-size: 6vh; margin-top: 7vh; padding: 2.5vh 5vw; border: 0.6vh solid var(--ink); border-radius: 3vh; }
  @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  /* 再生中 */
  #playing .head { font-size: 5vh; color: var(--sub); }
  #playing .head b { color: var(--ink); font-size: 6.5vh; }
  #playing .body { flex: 1; display: flex; gap: 4vw; align-items: center; margin-top: 3vh; min-height: 0; }
  #playing .body img { max-height: 100%; max-width: 55%; object-fit: contain; border-radius: 2vh; }
  #playing .text { font-size: 7vh; line-height: 1.55; white-space: pre-wrap; overflow: hidden; }
  #playing.photo .text { font-size: 5.5vh; }

  /* ひとこと（送りました など） */
  #notice {
    position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); font-size: 6vh; padding: 2vh 5vw; border-radius: 3vh;
    display: none;
  }
  #notice.on { display: block; }

  /* 送ったあと：LINE に送った要約を大きく（10秒） */
  #sent {
    position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center;
    padding: 6vh 7vw; background: #e8f3e6; color: var(--ink);
  }
  #sent.on { display: flex; }
  #sent .title { font-size: 9vh; font-weight: bold; color: #2f6b2a; }
  #sent .label { font-size: 3.6vh; color: var(--sub); margin: 3vh 0 1.5vh; }
  #sent .summary {
    font-size: 6vh; line-height: 1.5; white-space: pre-wrap; background: var(--card);
    border-radius: 2vh; padding: 3vh 3vw; border-left: 1.2vh solid #2f6b2a;
  }

  /* 夜は暗く（U26 仮） */
  body.night { background: #000; color: #555; }
  body.night #idle .chat, body.night #idle .room, body.night #idle .date { display: none; }
  body.night #idle .bar { background: #000; justify-content: center; margin-top: 40vh; }
  body.night #idle .time { font-size: 10vh; color: #333; }

  #offline { position: fixed; top: 1vh; right: 1vw; font-size: 2.2vh; color: var(--sub); display: none; }
</style>
</head>
<body>
  <section id="idle" class="screen on">
    <div class="bar"><div class="room">家族の LINE</div><div class="date"></div><div class="time"></div></div>
    <div class="chat"></div>
  </section>

  <section id="new" class="screen">
    <div class="count"></div>
    <div class="from"></div>
    <div class="ask">受話器を取ってください</div>
  </section>

  <section id="playing" class="screen">
    <div class="head"></div>
    <div class="body"><img alt="" hidden><div class="text"></div></div>
  </section>

  <section id="sent">
    <div class="title">✓ 送りました</div>
    <div class="label">ご家族の LINE に、こう届きました</div>
    <div class="summary"></div>
  </section>

  <div id="notice"></div>
  <div id="offline">更新を待っています…</div>

<script>
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function show(mode) {
    for (const id of ["idle", "new", "playing"]) $("#" + id).classList.toggle("on", id === mode);
  }

  function render(s) {
    document.body.classList.toggle("night", s.night);
    $("#idle .date").textContent = s.clock.date;
    $("#idle .time").textContent = s.clock.time;

    if (s.mode === "idle") {
      const chat = s.chat || [];
      const html = chat.map((m) => {
        if (m.from === "parent") {
          const tags = (m.urgent ? '<span class="tag red">🚨至急</span>' : "")
                     + (m.pending ? '<span class="tag">送信待ち</span>' : "");
          return `
          <div class="msg parent">
            <div class="col"><div class="bubble${m.urgent ? " urgent" : ""}">${esc(m.text)}</div></div>
            <div class="meta">${tags}${esc(m.when)}</div>
          </div>`;
        }
        const body = m.photo
          ? `<img class="photo" src="${esc(m.photo)}" alt="">${m.text ? `<div class="bubble">${esc(m.text)}</div>` : ""}`
          : `<div class="bubble">${esc(m.text)}</div>`;
        return `
          <div class="msg family">
            <div class="avatar">${esc((m.sender || "?").slice(0, 1))}</div>
            <div class="col"><div class="name">${esc(m.sender)}さん</div>${body}</div>
            <div class="meta">${esc(m.when)}</div>
          </div>`;
      }).join("");
      const box = $("#idle .chat");
      const next = html || '<div class="empty">受話器を取って、話しかけてみてください</div>';
      if (box.dataset.html !== next) {  // 毎秒書き換えると写真がちらつくので、変わったときだけ
        box.innerHTML = next;
        box.dataset.html = next;
      }
    }

    if (s.mode === "new") {
      $("#new .count").textContent = `お便りが ${s.waiting.count} 件あります`;
      $("#new .from").textContent = s.waiting.senders.map((n) => n + "さん").join("、") + "から";
    }

    if (s.mode === "playing" && s.playing) {
      const p = s.playing;
      $("#playing .head").innerHTML = `<b>${esc(p.sender)}さん</b>から　${esc(p.when)}`;
      $("#playing .text").textContent = p.text;
      const img = $("#playing img");
      img.hidden = !p.photo;
      if (p.photo && img.getAttribute("src") !== p.photo) img.src = p.photo;
      $("#playing").classList.toggle("photo", !!p.photo);
    }

    show(s.mode);
    $("#notice").textContent = s.notice || "";
    $("#notice").classList.toggle("on", !!s.notice);
    $("#sent .summary").textContent = s.sent || "";
    $("#sent").classList.toggle("on", !!s.sent);
  }

  let server = null;  // 本番が起動し直したら、ページごと読み込み直す（画面の作りが変わっていることがあるため）

  async function tick() {
    try {
      const res = await fetch("/api/state", { cache: "no-store" });
      const s = await res.json();
      if (server && s.server && s.server !== server) {
        location.reload();
        return;
      }
      server = s.server || server;
      render(s);
      $("#offline").style.display = "none";
    } catch (e) {
      $("#offline").style.display = "block";
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
